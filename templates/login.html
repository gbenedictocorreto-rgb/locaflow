{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo_publico %}
<div class="login-page login-page--split">
  <div class="login-ilustracao">
    <div class="login-ilustracao__conteudo">
      <img class="login-banner-img" src="{{ url_for('static', filename='img/login-banner.jpg') }}" alt="{{ app_name }} — {{ app_tagline }}">

      <div class="login-ilustracao__cta">
        <p>Se você ainda não é um cliente <strong>{{ app_name }}</strong> — {{ app_tagline|lower }} —</p>
        <a href="{{ demo_contato_link }}" class="btn btn-claro">{{ demo_contato_texto }}</a>
      </div>
    </div>
  </div>

  <div class="login-form-lado">
    <form method="post" class="login-card login-card--split">
      <h1 class="login-titulo">Bem-vindo de volta</h1>
      <p class="login-subtitulo">Entre com sua conta para acessar o painel.</p>

      <label>E-mail</label>
      <input type="email" name="email" required autofocus placeholder="seu@email.com">
      <label>Senha</label>
      <input type="password" name="senha" required placeholder="••••••••">

      <button type="submit" class="btn btn-primario btn-full">Entrar</button>

      <p class="login-esqueci">
        <a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
