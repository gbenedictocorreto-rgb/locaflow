{% extends "base.html" %}
{% block titulo %}Novo lançamento{% endblock %}
{% block conteudo %}
<div class="pagina-header">
  <h1>Novo lançamento financeiro</h1>
</div>

<form method="post" class="form-padrao">
  <div class="grid-2">
    <div class="campo">
      <label>Cliente *</label>
      <select name="cliente_id" required>
        <option value="">-- Selecione --</option>
        {% for c in clientes %}
        <option value="{{ c['id'] }}">{{ c['nome'] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="campo">
      <label>Locação relacionada (opcional)</label>
      <select name="locacao_id">
        <option value="">-- Nenhuma --</option>
        {% for l in locacoes %}
        <option value="{{ l['id'] }}">#{{ l['id'] }} - {{ l['placa'] }} - {{ l['cliente_nome'] }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="grid-2">
    <div class="campo">
      <label>Tipo</label>
      <select name="tipo">
        <option value="aluguel">Aluguel</option>
        <option value="caucao">Caução</option>
        <option value="multa">Multa</option>
        <option value="dano">Dano</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <div class="campo">
      <label>Vencimento *</label>
      <input type="date" name="vencimento" required>
    </div>
  </div>
  <div class="grid-2">
    <div class="campo">
      <label>Valor (R$) *</label>
      <input type="number" step="0.01" name="valor" required>
    </div>
    <div class="campo">
      <label>Descrição</label>
      <input type="text" name="descricao">
    </div>
  </div>
  <div class="acoes">
    <button type="submit" class="btn btn-primario">Salvar lançamento</button>
    <a href="{{ url_for('financeiro.listar') }}" class="btn">Cancelar</a>
  </div>
</form>
{% endblock %}
